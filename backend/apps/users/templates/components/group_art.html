  <circle cx="17" cy="18" r="11" fill="#A7C957"/><rect x="25" y="7" width="15" height="28" rx="7" fill="#C7B3EE"/><path d="M8 32h32" stroke="#1F4D3A" stroke-width="5" stroke-linecap="round"/><circle cx="30" cy="33" r="7" fill="#F4D06F"/>
  {% endif %}
</svg>
{% endwith %}
