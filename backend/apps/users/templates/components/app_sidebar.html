{% load static %}
<aside class="social-sidebar" aria-label="Menú de Plan B">
  <a class="social-side-brand pb-brand-side" href="{% url 'users:dashboard' %}" aria-label="Plan B, ir al inicio"><img class="pb-brand-side__image pb-brand-side__image--light" src="{% static 'users/img/planb-wordmark.png' %}?v=4" alt="planb." width="590" height="354"><img class="pb-brand-side__image pb-brand-side__image--dark" src="{% static 'users/img/planb-wordmark-light.png' %}?v=4" alt="" aria-hidden="true" width="590" height="354"></a>
  <nav class="social-side-nav" aria-label="Navegación principal">
    <a href="{% url 'users:dashboard' %}" {% if request.resolver_match.namespace == 'users' and request.resolver_match.url_name == 'dashboard' %}class="social-side-active" aria-current="page"{% endif %}><svg class="pb-nav-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1z"/><path d="M9 21v-8h6v8"/></svg><span class="pb-nav-label">Inicio</span></a>
    <a href="{% url 'groups:index' %}" {% if request.resolver_match.namespace == 'groups' %}class="social-side-active" aria-current="page"{% endif %}><svg class="pb-nav-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg><span class="pb-nav-label">Mis grupos</span></a>
    <a href="{% url 'plans:index' %}" {% if request.resolver_match.namespace == 'plans' %}class="social-side-active" aria-current="page"{% endif %}><svg class="pb-nav-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/><path d="m9 16 2 2 4-4"/></svg><span class="pb-nav-label">Planes</span></a>
    <a href="{% url 'users:calendar' %}" {% if request.resolver_match.namespace == 'users' and request.resolver_match.url_name == 'calendar' %}class="social-side-active" aria-current="page"{% endif %}><svg class="pb-nav-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/><circle cx="8" cy="14" r=".5"/><circle cx="12" cy="14" r=".5"/><circle cx="16" cy="14" r=".5"/><circle cx="8" cy="18" r=".5"/><circle cx="12" cy="18" r=".5"/></svg><span class="pb-nav-label">Calendario</span></a>
    <a href="{% url 'notifications:index' %}" {% if request.resolver_match.namespace == 'notifications' %}class="social-side-active" aria-current="page"{% endif %}><svg class="pb-nav-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"/><path d="M10 21h4"/></svg><span class="pb-nav-label">Notificaciones</span></a>
    <a href="{% url 'users:profile' %}" {% if request.resolver_match.namespace == 'users' and request.resolver_match.url_name == 'profile' %}class="social-side-active" aria-current="page"{% endif %}><svg class="pb-nav-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="9" r="3"/><path d="M5.6 19a7 7 0 0 1 12.8 0"/></svg><span class="pb-nav-label">Mi perfil</span></a>
  </nav>
  <div class="pb-sidebar-footer" aria-label="Preferencias y cuenta">
  <div class="pb-theme-sidebar-control" aria-label="Preferencias de apariencia">
    <div class="pb-theme-sidebar-copy"><strong>Modo oscuro</strong><small>Cambiar apariencia</small></div>
    <button type="button" class="pb-theme-sidebar-switch" role="switch" aria-checked="false"
            data-theme-toggle data-theme-compact aria-label="Activar modo oscuro" title="Cambiar apariencia">
      <span class="pb-theme-sidebar-knob" aria-hidden="true"></span>
    </button>
  </div>
  <div class="social-side-bottom"><span class="social-side-bottom-icon" aria-hidden="true">✦</span><strong>Más planes,<br>más momentos.</strong><small>Todo comienza con tu grupo.</small></div>
  <form method="post" action="{% url 'users:logout' %}" class="pb-sidebar-logout">
    {% csrf_token %}
    <button type="submit" class="pb-sidebar-logout__button" aria-label="Cerrar sesión">
      <svg aria-hidden="true" focusable="false" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M10 17l5-5-5-5M15 12H3"/><path d="M12 3h6a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-6"/></svg>
      <span>Cerrar sesión</span>
    </button>
  </form>
  </div>
</aside>
