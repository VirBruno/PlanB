{% extends 'base.html' %}
{% load static %}
{% block extra_css %}<link rel="stylesheet" href="{% static 'users/css/group-transitions.css' %}">{% endblock %}
{% block body %}
<header class="dashboard-header">
  <div class="dashboard-header-inner">
    {% include 'components/brand.html' %}
    <nav aria-label="Navegación principal">
      <a href="{% url 'users:dashboard' %}" {% if request.resolver_match.url_name == "dashboard" %}aria-current="page"{% endif %}>Mi espacio</a>
    </nav>
    <a class="profile-icon" href="{% url 'users:profile' %}" aria-label="Ir a mi perfil" title="Mi perfil">
      <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="8" r="3.5"/><path d="M5 20v-1.4a7 7 0 0 1 14 0V20z"/></svg>
    </a>
  </div>
</header>
<main class="dashboard-main" id="contenido">
  {% include 'components/messages.html' %}
  {% block workspace %}{% endblock %}
</main>
<footer class="dashboard-footer"><span>Siempre hay un Plan B.</span><span>Hecho para encontrarnos</span></footer>
{% endblock %}
